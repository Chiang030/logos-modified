[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "logos-agent"
version = "0.1.0"
description = "Local LangGraph implementation of the Logos multiphysics simulation agent"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.7,<0.8",
    "langchain>=1.2,<2",
    "langgraph>=1.2,<2",
    "langgraph-sdk>=0.4,<0.5",
    "langchain-openai>=1.6,<2",
    "pydantic>=2.7,<2.13",
    "python-dotenv>=1.2,<2",
]

[project.optional-dependencies]
dev = [
    "colorama>=0.4,<1",
    "langgraph-cli[inmem]>=0.4,<1",
    "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
markers = [
    "live: calls the configured external language model",
]
