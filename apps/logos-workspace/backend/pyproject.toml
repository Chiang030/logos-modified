[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "logos-workspace"
version = "0.1.0"
description = "Web control plane for the Logos multi-agent engineering workspace"
requires-python = ">=3.12,<4.0"
dependencies = [
    "aiosqlite>=0.22,<1",
    "asyncpg>=0.30,<1",
    "deepagents>=0.7.22,<0.8",
    "fastapi>=0.118,<1",
    "httpx>=0.28,<1",
    "langchain-openai>=1.0,<2",
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-postgres>=3.0,<4",
    "langgraph-cli[inmem]>=0.4,<1",
    "langgraph-sdk>=0.4,<1",
    "pydantic-settings>=2.10,<3",
    "python-multipart>=0.0.20,<1",
    "sqlalchemy[asyncio]>=2.0.43,<3",
    "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
test = [
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.14,<1",
]

[tool.uv.sources]
deepagents = { path = "../../../libs/deepagents", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["logos_workspace"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Product-facing Agent prompts and deterministic replies are written in Chinese.
"logos_workspace/agents/*.py" = ["RUF001"]
"logos_workspace/runtime.py" = ["RUF001"]
