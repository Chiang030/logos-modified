services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: logos
      POSTGRES_USER: logos
      POSTGRES_PASSWORD: logos
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logos -d logos"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - logos-postgres:/var/lib/postgresql/data

volumes:
  logos-postgres:
